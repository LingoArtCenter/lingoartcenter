<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoArt</title>
<meta name="description" content="LingoArt — تكلم ... حتى تتعلم">
<meta name="theme-color" content="#faf8f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #21102f;
    --text: #2d2d2d;
    --green: #45bb96;
    --bg: #faf8f5;
    --card: rgba(255, 255, 255, .72);
    --line: rgba(33, 16, 47, .08);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- ambient background ---------- */
  .aura { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aura span {
    position: absolute; border-radius: 50%; filter: blur(70px); opacity: .0;
    animation: auraIn 2.4s var(--ease) .2s forwards, drift 22s ease-in-out infinite alternate;
  }
  .aura .a1 { width: 70vmax; height: 70vmax; background: radial-gradient(circle, rgba(69,187,150,.42), transparent 65%); top: -30vmax; right: -25vmax; }
  .aura .a2 { width: 60vmax; height: 60vmax; background: radial-gradient(circle, rgba(33,16,47,.18), transparent 65%); bottom: -28vmax; left: -22vmax; animation-delay: .2s, -8s; }
  .aura .a3 { width: 40vmax; height: 40vmax; background: radial-gradient(circle, rgba(69,187,150,.22), transparent 65%); top: 45%; left: 55%; animation-delay: .2s, -15s; }
  @keyframes auraIn { to { opacity: 1; } }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(4vmax, 3vmax) scale(1.08); }
    100% { transform: translate(-3vmax, 5vmax) scale(.96); }
  }

  /* ---------- layout ---------- */
  main {
    position: relative; z-index: 1;
    min-height: 100svh;
    max-width: 440px; margin: 0 auto;
    padding: max(56px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }

  /* ---------- logo ---------- */
  .logo {
    width: min(90vw, 400px); height: auto; overflow: visible;
    animation: logoIn 1.6s var(--ease) both;
  }
  @keyframes logoIn {
    from { transform: scale(.94); filter: blur(6px); opacity: 0; }
    to   { transform: scale(1);   filter: blur(0);   opacity: 1; }
  }
  .logo .s {
    stroke-width: 1.1; stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.35s var(--ease) var(--d, 0s) both;
  }
  .logo .ink   { fill: var(--ink);   stroke: var(--ink); }
  .logo .green { fill: var(--green); stroke: var(--green); }
  .logo .dark  { fill: #262f39; stroke: #262f39; }
  .logo .tag   { fill: #2d2e2d; animation: fade .9s var(--ease) 1.15s both; }
  .logo .small { stroke: none; animation: fade .9s var(--ease) 1.05s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* the green divider grows first, then each logo slides out from it */
  .logo .divider {
    fill: var(--green);
    transform-box: fill-box; transform-origin: 50% 50%;
    animation: divide 1s var(--ease) .05s both;
  }
  @keyframes divide { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .logo .side-l { animation: fromDivL 1.4s var(--ease) .15s both; }
  .logo .side-r { animation: fromDivR 1.4s var(--ease) .15s both; }
  @keyframes fromDivL { from { transform: translateX(40px);  opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fromDivR { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .logo .rule-l {
    stroke: none;
    transform-box: fill-box; transform-origin: 100% 50%;
    animation: grow 1s var(--ease) .8s both;
  }
  @keyframes draw {
    0%   { stroke-dashoffset: 1; fill-opacity: 0; stroke-opacity: 1; }
    55%  { stroke-dashoffset: 0; fill-opacity: 0; }
    100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
  }
  .logo .smile {
    stroke: none;
    transform-box: fill-box; transform-origin: 50% 0;
    animation: smile .9s var(--ease) 1.05s both;
  }
  @keyframes smile {
    from { transform: scale(.2, .2); opacity: 0; }
    to   { transform: scale(1, 1);   opacity: 1; }
  }
  .logo .sheen { animation: sheen 7s ease-in-out 2.4s infinite; }
  @keyframes sheen {
    0%        { transform: translateX(-140px) skewX(-20deg); }
    22%, 100% { transform: translateX(1000px) skewX(-20deg); }
  }

  .tagline {
    margin-top: 14px;
    font-weight: 500; font-size: clamp(18px, 5.2vw, 22px); color: var(--text);
    letter-spacing: .5px;
    animation: rise .9s var(--ease) 1.2s both;
  }
  .rule {
    width: 44px; height: 2px; border-radius: 2px; margin: 26px 0 22px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    animation: grow .9s var(--ease) 1.35s both;
  }
  @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }

  /* ---------- links ---------- */
  .links { width: 100%; display: grid; gap: 12px; list-style: none; }
  .links li { animation: rise .8s var(--ease) var(--d) both; }
  @keyframes rise {
    from { transform: translateY(16px); opacity: 0; filter: blur(4px); }
    to   { transform: translateY(0);    opacity: 1; filter: blur(0); }
  }
  .btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(33,16,47,.04), 0 8px 24px -12px rgba(33,16,47,.18);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--ink); text-decoration: none;
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn:focus-visible {
    transform: translateY(-2px);
    border-color: rgba(69,187,150,.45);
    box-shadow: 0 1px 2px rgba(33,16,47,.04), 0 14px 32px -14px rgba(69,187,150,.55);
    outline: none;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary {
    background: linear-gradient(135deg, #4cc59f, #35a07f);
    border-color: transparent; color: #fff;
    box-shadow: 0 1px 2px rgba(33,16,47,.06), 0 12px 28px -12px rgba(53,160,127,.7);
  }
  .btn.primary .icon, .btn.primary:hover .icon { background: rgba(255,255,255,.2); color: #fff; }
  .btn.primary .label small { color: rgba(255,255,255,.82); }
  .btn.primary .chev, .btn.primary:hover .chev { color: rgba(255,255,255,.75); }
  .btn::after { /* one-time light pass when the button arrives */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.85) 50%, transparent 65%);
    transform: translateX(110%);
    animation: pass 1.1s var(--ease) calc(var(--d) + .35s) both;
    pointer-events: none;
  }
  @keyframes pass { to { transform: translateX(-110%); } }

  .icon {
    flex: none; width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center;
    background: rgba(69,187,150,.12); color: var(--green);
    transition: background .35s var(--ease), color .35s var(--ease);
  }
  .btn:hover .icon, .btn:focus-visible .icon { background: var(--green); color: #fff; }
  .icon svg { width: 22px; height: 22px; }
  .label { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
  .label b { font-weight: 700; font-size: 16px; }
  .label small { font-family: 'Inter', sans-serif; font-size: 12.5px; color: rgba(33,16,47,.5); direction: ltr; text-align: right; }
  .chev { flex: none; width: 18px; height: 18px; color: rgba(33,16,47,.3); transition: transform .35s var(--ease), color .35s var(--ease); }
  .btn:hover .chev { transform: translateX(-3px); color: var(--green); }

  footer {
    margin-top: auto; padding-top: 36px;
    font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(33,16,47,.38);
    animation: rise .8s var(--ease) 1.6s both;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .logo .s { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
    .btn::after, .logo .sheen { display: none; }
  }
</style>
</head>

  // Reuse the letter shapes as the clip for the light sweep.
  const clip = document.getElementById('mark');
  document.querySelectorAll('#art path, #art polygon, #art rect').forEach(p => {
    const c = p.cloneNode();
    c.removeAttribute('class'); c.removeAttribute('style');
    clip.appendChild(c);
  });

  // Tap the logo to replay the intro.
  document.querySelector('.logo').addEventListener('click', () => {
    document.getAnimations().forEach(a => {
      if (a.animationName === 'drift') return;
      a.cancel(); a.play();
    });
  });
</script>
</body>
</html>
